name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/v4.5-background-sampling
      - fix/v4.5.1-history-migration
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug signing key
        run: |
          base64 --decode battery42-debug.keystore.b64 > battery42-debug.keystore
          keytool -list -keystore battery42-debug.keystore -storepass android -alias battery42
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryMonitor42-v4.5.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
