
name: Import Battery Monitor 42 v4.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import v4.1 archive
        run: |
          set -e
          ARCHIVE="BatteryMonitor42-v4.1-GitHub.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive already imported; continuing to build."
            exit 0
          fi

          mkdir -p /tmp/battery42-import
          unzip -oq "$ARCHIVE" -d /tmp/battery42-import

          test -f /tmp/battery42-import/app/build.gradle
          test -f /tmp/battery42-import/app/src/main/java/ru/dmitry/batterymonitor42/MainActivity.java

          cp -a /tmp/battery42-import/. .
          rm -f "$ARCHIVE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Battery Monitor 42 v4.1"
          git push origin HEAD:main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key
        run: |
          base64 --decode battery42-debug.keystore.b64 > battery42-debug.keystore
          keytool -list -keystore battery42-debug.keystore -storepass android -alias battery42

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryMonitor42-v4.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
